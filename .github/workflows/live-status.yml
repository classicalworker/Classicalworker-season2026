name: 配信ステータス自動更新

on:
  schedule:
    # 10分おきに実行(UTC基準のcron)。GitHub側の都合で数分遅延することがあります。
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "live-status"
  cancel-in-progress: true

jobs:
  update-live-status:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 依存パッケージをインストール
        run: npm install --no-audit --no-fund

      - name: yt-dlpをインストール
        # YouTubeのライブ配信検出に使用。継続的にメンテナンスされているOSSを使うことで、
        # 自前のHTML正規表現パースで起きていた誤検出(無関係な動画が混ざる等)を避ける。
        run: |
          pip install --no-cache-dir -U yt-dlp
          yt-dlp --version

      - name: 配信ステータスを更新
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/update-live-status.mjs
